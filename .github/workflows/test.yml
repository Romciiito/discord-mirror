name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            arch: x64
          - os: windows-latest
            python: "3.10"
            arch: x64
          - os: windows-latest
            python: "3.12"
            arch: x64
          - os: windows-latest
            python: "3.12"
            arch: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - run: python -c "import platform, struct, sys; print(sys.version, platform.machine(), struct.calcsize('P') * 8)"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_core tests.test_store tests.test_keychain tests.test_provision tests.test_relay tests.test_gateway tests.test_engine tests.test_web tests.test_cli_flow tests.test_cli_controller tests.test_cli_render -q
      - name: smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $port = python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])"
          $env:PORT = "$port"
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "mando smoke"
          $err = Join-Path $env:RUNNER_TEMP "mirror.err"
          $out = Join-Path $env:RUNNER_TEMP "mirror.out"
          $app = Start-Process -FilePath python -ArgumentList "-m", "mirror" -PassThru -NoNewWindow -RedirectStandardError $err -RedirectStandardOutput $out
          $state = 0
          for ($i = 0; $i -lt 60; $i++) {
            if ($app.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/api/state" -TimeoutSec 2
              $state = $r.StatusCode
              if ($state -eq 200) { break }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          $code = & curl.exe -s -o NUL -w "%{http_code}" -X POST -H "Origin: https://evil.example" "http://127.0.0.1:$port/api/stop"
          $body = & curl.exe -s -X POST -H "Origin: https://evil.example" "http://127.0.0.1:$port/api/stop"
          $plain = & curl.exe -s -o NUL -w "%{http_code}" -X POST "http://127.0.0.1:$port/api/stop"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
          Write-Host "state $state, cross-origin $code $body, same-origin $plain"
          if ($state -ne 200 -or $code -ne "403" -or "$body" -notmatch "bad origin" -or $plain -ne "200") { exit 1 }
          exit 0
